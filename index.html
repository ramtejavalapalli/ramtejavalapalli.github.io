<!DOCTYPE html>
<html>

<head>
    <title>My Website</title>

    <style>
        /* General page styling */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Navigation bar */
        nav {
            background-color: #222;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 20px;
            font-size: 18px;
        }

        nav a:hover {
            color: #00bfff;
        }

        /* Sections */
        section {
            padding: 60px 20px;
            text-align: center;
            min-height: 200px;
        }

        /* Home */
        #home {
            background-color: white;
        }

        #home h1 {
            font-size: 40px;
        }

        /* About */
        #about {
            background-color: #e8f4ff;
        }

        /* Projects */
        #projects {
            background-color: white;
        }

        /* Contact */
        #contact {
            background-color: #e8f4ff;
        }

        /* Headings */
        h2 {
            font-size: 30px;
        }
    </style>

</head>

<body>

    <!-- Navigation -->
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#projects">Projects</a>
        <a href="#contact">Contact</a>
    </nav>

    <!-- Home -->
    <section id="home">
        <h1>Welcome to My Website</h1>
        <p>This is my personal website.</p>
    </section>

    <!-- About -->
    <section id="about">
        <h2>About Me</h2>
        <p>I am learning web development and building my website step by step.</p>
    </section>

    <!-- Projects -->
    <section id="projects">
        <h2>My Projects</h2>
        <p>My projects will be displayed here.</p>
    </section>

    <!-- Contact -->
    <section id="contact">
        <h2>Contact Me</h2>
        <p>You can contact me here.</p>
    </section>

</body>

</html>
